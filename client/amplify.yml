# Amplify build settings. In the Amplify console, set "Monorepo app root" to "client" (if the repo holds both apps).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # VITE_API_URL is read at build time, so set it in Amplify's environment variables first.
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
